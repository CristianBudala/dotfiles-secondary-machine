# ==============================================================================
# Hyprland Configuration - Catppuccin Mocha Theme
# ==============================================================================

# --- Monitors ---
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1

# --- Default Programs ---
$terminal = wezterm start --always-new-process
$zellijTerminal = wezterm start --always-new-process -- zellij
$fileManager = nemo
$menu = rofi -show drun || wofi --show drun
$runMenu = rofi -show run || wofi --show run

# --- Environment Variables ---
# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1

# --- Autostart ---
# See https://wiki.hyprland.org/Configuring/Keywords/#exec
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
exec-once = waybar
exec-once = dunst
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/lib/polkit-kde-authentication-agent-1

# Create screenshot directory if missing
exec-once = mkdir -p ~/Pictures/Screenshots

# --- Look and Feel (Catppuccin Mocha) ---
# See https://wiki.hyprland.org/Configuring/Variables/

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Catppuccin Mocha Mauve to Blue gradient
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 0.98
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        vibrancy = 0.1696
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(11111b80)
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = popinBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, popinBezier
    animation = windowsOut, 1, 4, easeOutQuint, popin 80%
    animation = border, 1, 6, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, easeOutQuint, slide
    animation = specialWorkspace, 1, 4, easeOutQuint, slidevert
}

# --- Layouts ---
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vrr = 1
}

# --- Input Configuration ---
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# --- Window Rules ---
# Floating windows & dialogs
windowrule = float = true, match:class = pavucontrol
windowrule = float = true, match:class = nm-connection-editor
windowrule = float = true, match:class = nemo, match:title = File Operation Progress
windowrule = float = true, match:class = nemo, match:title = Confirm to replace files
windowrule = float = true, match:title = Open File
windowrule = float = true, match:title = Save File
windowrule = float = true, match:class = wlogout
windowrule = float = true, match:class = xdg-desktop-portal-gtk

# Prevent maximize requests from disrupting tiling
windowrule = suppress_event = maximize, match:class = .*

# Fix XWayland drag-drop glitches
windowrule = no_focus = true, match:xwayland = true, match:float = true

# --- Keybindings ---
$mainMod = SUPER

# Applications
bind = $mainMod, t, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, grave, exec, $terminal
bind = $mainMod, asciitilde, exec, $terminal
bind = $mainMod, code:49, exec, $terminal
bind = $mainMod SHIFT, t, exec, $zellijTerminal
bind = $mainMod SHIFT, Return, exec, $zellijTerminal
bind = $mainMod SHIFT, grave, exec, $zellijTerminal
bind = $mainMod SHIFT, code:49, exec, $zellijTerminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, Space, exec, $menu
bind = $mainMod, R, exec, $runMenu

# Window Actions
bind = $mainMod, Q, killactive,
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, Tab, cyclenext,
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev

# Focus Navigation (Vim Keys + Arrows)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move Windows (Vim Keys + Arrows)
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize Windows (Vim Keys + Arrows)
bind = $mainMod ALT, h, resizeactive, -30 0
bind = $mainMod ALT, l, resizeactive, 30 0
bind = $mainMod ALT, k, resizeactive, 0 -30
bind = $mainMod ALT, j, resizeactive, 0 30
bind = $mainMod ALT, left, resizeactive, -30 0
bind = $mainMod ALT, right, resizeactive, 30 0
bind = $mainMod ALT, up, resizeactive, 0 -30
bind = $mainMod ALT, down, resizeactive, 0 30

# Workspaces (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace (1-10)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special Workspace (Scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

# Workspace mouse scrolling
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse dragging/resizing
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (Area selection with slurp, full screen with shift)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send -i camera-photo "Screenshot" "Area copied to clipboard"
bind = SHIFT, Print, exec, grim ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d_%H%M%S).png && grim - | wl-copy && notify-send -i camera-photo "Screenshot" "Full screenshot saved & copied"

# Audio & Brightness Controls (wpctl & brightnessctl)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media Player Controls (playerctl)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
